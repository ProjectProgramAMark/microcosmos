# @package _global_
experiment:
  type: worm_swim_example
  num_nodes: 50
  grid_shape: [256, 256]
  init_line_distance: 2.0
  num_wavelengths: 2
  rotation_speed: 0.05

simulation:
  dt: 0.01
  num_steps: 1400
  subsample: 4
  fps: 30
  realtime: false

physics:
  scheme: pbd  # 'pbd' or 'stable_cosserat'

  # PBD stiffness (0-1 fractions)
  stiffness_stretch_pbd: 0.6
  stiffness_shear_pbd: 1.0

  # Cosserat stiffness (physical units; scales as k_s ≈ l_e² · 1/dt²)
  # l_e=2.0, dt=0.01 → w=10000, k_s/l²=12500 → k_s=50000
  stiffness_stretch_stable_cosserat: 50000.0
  stiffness_shear_stable_cosserat: 50000.0

  max_fluid_velocity: 0.10
  synthetic_node_width: 0.3
  ibm_kernel_size: 4
