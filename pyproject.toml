[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'", # macbooks
    "sys_platform == 'linux' and platform_machine == 'x86_64'"  # CUDA machines
]

[project]
dependencies = [
  "evosax>=0.2.0",
  "flax>=0.12.2",
  "hydra-core>=1.3.2",
  "jax",
  "matplotlib>=3.10.7",
  "networkx>=3.0",
  "omegaconf>=2.3.0",
  "opencv-python>=4.12.0.88",
  "optax>=0.2.6",
  "tensorboard>=2.20.0",
  "tensorneat",
  "torch>=2.9.1",
  "torchvision>=0.24.1",
  "tqdm>=4.67.1",
]

description = "Open-ended evolution of worm-like chains"
name = "microcosmos"
readme = "README.md"
requires-python = ">=3.13"
version = "0.1.0"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microcosmos"]

[tool.ruff]
line-length = 160


[tool.uv.sources]
tensorneat = { git = "https://github.com/EMI-Group/tensorneat.git" }
